<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-lg max-w-md w-full border border-slate-700 shadow-xl">
        <h1 class="text-2xl font-bold text-amber-500 text-center mb-2">Shop Manager</h1>
        <p class="text-sm text-gray-400 text-center mb-6">Enter Admin Password to continue</p>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-amber-500">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-slate-900 py-2.5 rounded font-bold hover:bg-amber-400 transition mt-2">
                Unlock Dashboard
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const result = await response.json();
            if (result.success) {
                window.location.href = '/admin.html'; // Redirect to dashboard only ON SUBMIT
            } else {
                alert('Wrong password. Access Denied.');
            }
        });
    </script>
</body>
</html>
