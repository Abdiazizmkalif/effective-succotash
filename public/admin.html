<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UC Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-amber-500">Incoming UC Orders Dashboard</h1>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-sm font-bold transition">Logout</button>
    </div>
    
    <div class="overflow-x-auto bg-slate-800 rounded-lg shadow border border-slate-700">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-700 text-gray-300 text-sm uppercase">
                    <th class="p-3">Player ID</th>
                    <th class="p-3">In-Game Name</th>
                    <th class="p-3">Customer Details</th>
                    <th class="p-3">Package</th>
                    <th class="p-3">Amount</th>
                    <th class="p-3">Method</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Action</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                </tbody>
        </table>
    </div>

    <script>
        async function fetchOrders() {
            const res = await fetch('/api/orders');
            
            // If backend says unauthorized, boot them to the login screen
            if (res.status === 403) {
                window.location.href = '/login.html';
                return;
            }

            const orders = await res.json();
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            orders.forEach(order => {
                const isPending = order.status === 'PENDING';
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700 hover:bg-slate-750">
                        <td class="p-3 font-mono font-bold text-amber-400 select-all">${order.playerId}</td>
                        <td class="p-3">${order.playerName}</td>
                        <td class="p-3 text-sm text-gray-400">${order.fullName} (${order.phone})</td>
                        <td class="p-3 font-semibold">${order.packageUc}</td>
                        <td class="p-3">${order.priceEtb} ETB</td>
                        <td class="p-3 uppercase text-xs font-bold text-gray-300">${order.paymentMethod}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-bold ${isPending ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}">
                                ${order.status}
                            </span>
                        </td>
                        <td class="p-3">
                            ${isPending ? `<button onclick="completeOrder(${order.id})" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-xs font-bold transition">Complete</button>` : '<span class="text-gray-500 text-xs">Done</span>'}
                        </td>
                    </tr>
                `;
            });
        }

        async function completeOrder(id) {
            if (confirm('Are you sure you loaded the UC onto Midasbuy for this ID?')) {
                const res = await fetch(`/api/orders/${id}/complete`, { method: 'PUT' });
                
                if (res.status === 403) { 
                    window.location.href = '/login.html'; 
                    return; 
                }
                
                if (res.ok) {
                    fetchOrders(); // Simply refresh the table view if the database update succeeded
                } else {
                    alert('Error updating order on backend.');
                }
            }
        }

        async function logout() {
            // Wait for the server to clear the cookie completely
            await fetch('/api/admin/logout', { method: 'POST' });
            // Now safely redirect to login page
            window.location.href = '/index.html';
        }

        // Initialize and setup background auto-refresh
        fetchOrders();
        setInterval(fetchOrders, 30000);
    </script>
</body>
</html>
